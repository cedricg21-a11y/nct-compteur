name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilation
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk nct-compteur.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: nct-compteur.apk
      - name: Publication de l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" nct-compteur.apk \
            --title "NCT Compteur v0.1.${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message }}" --latest

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android 8.1 (480x800) + captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86
          target: default
          profile: Nexus S
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p shots
            adb install -r nct-compteur.apk
            adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 -e splash 1 ; sleep 2 ; adb exec-out screencap -p > shots/0-splash.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 1000 --ei page 0 ; sleep 4 ; adb exec-out screencap -p > shots/1-live.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 2600 --ei page 1 ; sleep 4 ; adb exec-out screencap -p > shots/2-effort.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 1500 --ei page 2 ; sleep 4 ; adb exec-out screencap -p > shots/3-grimpee.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 2400 --ei lap 1500 --ei page 3 ; sleep 4 ; adb exec-out screencap -p > shots/4-tour.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 300 --ei mode 1 ; sleep 3 ; adb exec-out screencap -p > shots/5-menu.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 300 --ei mode 2 ; sleep 3 ; adb exec-out screencap -p > shots/6-capteurs.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 300 --ei mode 3 ; sleep 3 ; adb exec-out screencap -p > shots/7-profil.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 3000 --ei mode 9 ; sleep 3 ; adb exec-out screencap -p > shots/9-resume.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity -e demo 1 --ei ff 3000 --ei mode 8 ; sleep 3 ; adb exec-out screencap -p > shots/9a-pause.png
            adb shell am force-stop fr.nct.compteur ; adb shell am start -W -n fr.nct.compteur/.MainActivity ; sleep 6 ; adb exec-out screencap -p > shots/8-premier-lancement.png
            adb logcat -d -s AndroidRuntime:E NCT-RIDE:* NCT-BLE:* > shots/logcat.txt || true
      - name: Publication des captures (branche screens)
        if: always()
        run: |
          cd shots
          git init -q -b screens
          git add .
          git -c user.name=ci -c user.email=ci@nct commit -qm "Captures build ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screens
