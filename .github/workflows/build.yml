name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilation
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Publication de l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk nct-compteur.apk
          gh release create "v0.1.${{ github.run_number }}" nct-compteur.apk \
            --title "NCT Compteur v0.1.${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message }}" --latest
