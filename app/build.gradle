plugins { id 'com.android.application' }

def vCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'fr.nct.compteur'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.nct.compteur'
        minSdk 26
        targetSdk 28
        versionCode vCode
        versionName "0.1." + vCode
    }
    signingConfigs {
        nct {
            storeFile file('nct-debug.jks')
            storePassword 'nctcompteur'
            keyAlias 'nct'
            keyPassword 'nctcompteur'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.nct
        }
        debug { signingConfig signingConfigs.nct }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    def mf = '0.21.0'
    implementation "org.mapsforge:mapsforge-core:$mf"
    implementation "org.mapsforge:mapsforge-map:$mf"
    implementation "org.mapsforge:mapsforge-map-reader:$mf"
    implementation "org.mapsforge:mapsforge-themes:$mf"
    implementation "org.mapsforge:mapsforge-map-android:$mf"
    implementation 'com.caverock:androidsvg:1.4'
}
